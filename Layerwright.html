<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layerwright</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{--bg:#E9ECEF;--panel:#F6F7F9;--panel2:#E9ECF1;--line:#D3D8E0;--text:#1B2028;--muted:#69727F;--accent:#0F8F7E;--accent-soft:rgba(15,143,126,.16);--accent-ink:#fff;--canvas:#CBD1D9;--dot:#AEB5C0;--danger:#C93C3C;--guide:#E0338F;--field:#fff;--shadow:0 8px 28px rgba(20,30,50,.2);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--panel:#1B1F26;--panel2:#252A33;--line:#2F3541;--text:#E6E9EE;--muted:#8E97A5;--accent:#2FC4AE;--accent-soft:rgba(47,196,174,.18);--accent-ink:#06201B;--canvas:#10131A;--dot:#2A303B;--danger:#F07272;--field:#12151A;--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171C;--panel:#1B1F26;--panel2:#252A33;--line:#2F3541;--text:#E6E9EE;--muted:#8E97A5;--accent:#2FC4AE;--accent-soft:rgba(47,196,174,.18);--accent-ink:#06201B;--canvas:#10131A;--dot:#2A303B;--danger:#F07272;--field:#12151A;--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--panel);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{font:13px/1.35 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--panel);-webkit-text-size-adjust:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
#top{height:46px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.sp{flex:1}
.logo{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;letter-spacing:-.01em;padding:0 6px 0 2px}
#fname{background:transparent;border:0;color:var(--text);font:inherit;width:150px;padding:5px 7px;border-radius:7px;text-overflow:ellipsis}
#fname:hover,#fname:focus{background:var(--panel2);outline:none}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 6px;border:0;border-radius:8px;background:transparent;cursor:pointer;gap:5px;flex:none;white-space:nowrap}
.ib:hover{background:var(--panel2)}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib:disabled{opacity:.35;pointer-events:none}
.ib.sm{min-width:26px;height:26px;border-radius:6px}
#main{flex:1;display:flex;min-height:0;position:relative}
.pn{background:var(--panel);display:flex;flex-direction:column;min-height:0;flex:none}
#left{width:268px;border-right:1px solid var(--line)}
#right{width:304px;border-left:1px solid var(--line)}
.pn.off{display:none}
.tabs{display:flex;flex:none;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:36px;border:0;background:none;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.pb{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.pagebar{display:flex;align-items:center;gap:3px;padding:6px;border-bottom:1px solid var(--line);flex:none}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);touch-action:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.fr{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 10px 30px rgba(0,0,0,.22);overflow:hidden}
.fr iframe{display:block;border:0;background:transparent;pointer-events:none}
#ov,#shield{position:absolute;inset:0}
#ov{pointer-events:none;overflow:hidden}
#shield{touch-action:none}
.o{position:absolute;pointer-events:none}
.o.hv{outline:1.5px solid var(--accent);opacity:.75}
.o.sl{outline:1.5px solid var(--accent)}
.o.sl2{outline:1px solid var(--accent);opacity:.75}
.o.h{background:#fff;border:1.5px solid var(--accent);border-radius:2px}
.o.hr{border-radius:50%}
.o.chip{background:var(--accent);color:var(--accent-ink);font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.o.fl{color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.o.fl.sel{color:var(--accent)}
.o.gd{background:var(--guide)}
.o.mq{border:1px solid var(--accent);background:var(--accent-soft)}
.o.dr{background:var(--accent);border-radius:2px}
.o.ds{outline:1.5px dashed var(--accent);background:var(--accent-soft)}
.o.ms{background:var(--guide)}
.o.mt{background:var(--guide);color:#fff;font-size:10.5px;padding:0 4px;border-radius:3px;transform:translate(-50%,-50%);white-space:nowrap}
#crumbs{position:absolute;left:8px;right:8px;top:8px;display:none;gap:1px;align-items:center;overflow-x:auto;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 16px);scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
.cr{border:0;background:none;padding:3px 7px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:12px}
.cr:hover{background:var(--panel2)}
.cr.on{color:var(--text);font-weight:600;background:var(--panel2)}
.sepc{color:var(--muted);font-size:11px}
#tools,#selbar{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar,#selbar::-webkit-scrollbar{display:none}
#tools{bottom:12px}
#selbar{bottom:62px;display:none}
.vs{width:1px;background:var(--line);margin:4px 3px;flex:none}
#hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#hint .hc{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-width:340px;text-align:center;box-shadow:var(--shadow)}
#hint h3{margin:0 0 6px;font-size:17px;letter-spacing:-.01em}
#hint p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--text);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.full{width:100%}
.sec{border-bottom:1px solid var(--line)}
.sh{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;font-weight:600;font-size:12px;cursor:pointer}
.sh .ico{color:var(--muted);transition:transform .15s}
.sec.open>.sh .ico{transform:rotate(90deg)}
.sh .grow{flex:1}
.sb{display:none;padding:2px 10px 12px}
.sec.open>.sb{display:block}
.row{display:flex;align-items:center;gap:6px;margin:6px 0;min-height:26px}
.row>.fld,.row>.cf,.row>.seg,.row>.g2,.row>.g4,.row>.g3,.row>select{flex:1;min-width:0}
.lbl{width:58px;flex:none;color:var(--muted);font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.row>.g2,.row>.g4{margin:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}
.mi{position:relative;min-width:0}
.mi>span{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--muted);pointer-events:none}
.mi>.fld{padding-left:20px}
.fld{height:26px;min-width:0;width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--text);font:inherit;font-size:12px;font-variant-numeric:tabular-nums}
.fld::placeholder{color:var(--muted);opacity:.8}
.fld:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.fld{height:auto;padding:6px 7px;line-height:1.45;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre;overflow:auto;tab-size:2}
textarea.fld.wrap{white-space:pre-wrap;font-family:inherit;font-size:12px}
select.fld{padding-right:2px}
.seg{display:flex;background:var(--panel2);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;min-width:0;height:22px;padding:0 4px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.seg button.on{background:var(--field);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.cf{display:flex;align-items:center;gap:6px;min-width:0}
.sw{-webkit-appearance:none;appearance:none;width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;flex:none}
.sw::-webkit-color-swatch-wrapper{padding:0}.sw::-webkit-color-swatch{border:0;border-radius:5px}.sw::-moz-color-swatch{border:0;border-radius:5px}
.sw.none{background:linear-gradient(135deg,transparent 46%,#d33 46%,#d33 54%,transparent 54%)}
.hx{flex:1;text-transform:uppercase}
.al{width:44px;flex:none}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.rng{width:100%;accent-color:var(--accent);height:22px}
.note{color:var(--muted);font-size:11.5px;line-height:1.45;margin:6px 0}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--panel2);color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.stk{display:flex;align-items:center;gap:6px;margin:5px 0;padding:6px;background:var(--panel2);border-radius:8px}
.stk .g4{flex:1}
.alg{display:grid;grid-template-columns:repeat(3,16px);grid-template-rows:repeat(3,16px);gap:4px;padding:8px;background:var(--panel2);border-radius:8px;flex:none}
.alg button{border:0;padding:0;background:var(--line);border-radius:50%;width:6px;height:6px;margin:5px;cursor:pointer}
.alg button.on{background:var(--accent);transform:scale(1.5)}
.lr{display:flex;align-items:center;height:28px;gap:3px;padding-right:4px;margin:0 4px;border-radius:6px;cursor:pointer;white-space:nowrap}
.lr:hover{background:var(--panel2)}
.lr.sel{background:var(--accent-soft)}
.lr.sel .nm{font-weight:600}
.lr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lr .cv{width:16px;display:inline-flex;justify-content:center;color:var(--muted);flex:none}
.lr>.ico{color:var(--muted)}
.lr .tg{border:0;background:none;padding:2px;color:var(--muted);opacity:0;cursor:pointer;display:inline-flex}
.lr:hover .tg,.lr .tg.on{opacity:1}
.lr.dt{box-shadow:inset 0 2px 0 var(--accent)}.lr.db{box-shadow:inset 0 -2px 0 var(--accent)}.lr.di{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lr.more{color:var(--muted);font-size:11.5px;padding-left:30px}
.lr input{flex:1;min-width:0;height:22px}
.lh{display:flex;align-items:center;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.lh .t{flex:1;font-weight:600;font-size:12px;padding-left:4px}
.kit{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 12px}
.kit button{height:38px;border:1px solid var(--line);background:var(--field);border-radius:8px;cursor:pointer;font-size:12px;text-align:left;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kit button:hover{border-color:var(--accent)}
.pal{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.pal button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
.cmp{display:flex;align-items:center;gap:6px;margin:4px 10px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.cmp span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{padding:8px 10px;display:block}
details.rl{margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
details.rl summary{padding:6px 8px;cursor:pointer;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rl>div{padding:0 8px 8px}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(10,14,20,.5);padding:12px}
#modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card.wide{width:min(860px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);font-size:14px;flex:none}
.mb{padding:14px 16px;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.mb .row .lbl{width:92px}
.opt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;text-align:left;width:100%;margin:0 0 8px}
.opt:hover{border-color:var(--accent)}
.opt b{font-weight:600}.opt span{color:var(--muted);font-size:12px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;margin:8px 0}
.drop:hover{border-color:var(--accent);color:var(--text)}
.menu{position:fixed;z-index:80;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;max-height:70vh;overflow:auto}
.mi2{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
.mi2:hover{background:var(--panel2)}
.mi2 em{margin-left:auto;color:var(--muted);font-style:normal;font-size:11px;padding-left:14px}
.msep{height:1px;background:var(--line);margin:4px 0}
#pv{position:fixed;inset:0;z-index:75;background:var(--canvas);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#pv.show{display:flex}
#pv .pvb{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
#pv .pva{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px}
#pv iframe{border:0;background:#fff;box-shadow:var(--shadow);flex:none;transform-origin:0 0}
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (pointer:coarse){.fld{height:32px;font-size:16px}.seg button{height:28px}.ib.sm{min-width:30px;height:30px}.sw{width:32px;height:32px}.lr{height:36px}.lr .tg{opacity:1}.row{margin:8px 0}.sh{height:40px}.chk input{width:20px;height:20px}}
@media (max-width:899px){
 #left{position:absolute;left:0;top:0;bottom:0;width:min(88vw,330px);z-index:30;transform:translateX(-103%);transition:transform .22s ease;box-shadow:var(--shadow);border-right:1px solid var(--line)}
 #left.open{transform:none}
 #right{position:absolute;left:0;right:0;bottom:0;height:54%;width:auto;z-index:31;transform:translateY(104%);transition:transform .22s ease;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow)}
 #right.open{transform:none}
 .pn.off{display:flex}
 #fname,.wm{display:none}
 #crumbs{top:6px}
}
@media (prefers-reduced-motion:reduce){#left,#right{transition:none}}
</style>
</head>
<body>
<div id="app">
 <header id="top"></header>
 <div id="main">
  <aside id="left" class="pn"></aside>
  <section id="stage">
   <div id="world"></div><div id="ov"></div><div id="shield"></div>
   <div id="crumbs"></div><div id="selbar"></div><div id="tools"></div><div id="hint"></div>
  </section>
  <aside id="right" class="pn"></aside>
 </div>
</div>
<div id="modal"></div><div id="pv"></div><div id="toast"></div>
<script>
'use strict';

const SVGNS='http://www.w3.org/2000/svg';

const IC={
move:'<path d="M5 3l14 8-6 2-2 6z"/>',

frame:'<path d="M7 3v18M17 3v18M3 7h18M3 17h18"/>',

image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',
plus:'<path d="M12 5v14M5 12h14"/>',

eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
